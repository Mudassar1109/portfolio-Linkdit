<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050d18"><title>Rewards Admin | M~M Web Development</title><link rel="icon" href="assets/mm-logo.svg"><link rel="stylesheet" href="assets/css/style.css"><style>
.admin-wrap{max-width:1100px;margin:70px auto;padding:24px}.admin-panel{padding:26px;border:1px solid rgba(0,217,255,.25);border-radius:22px;background:linear-gradient(145deg,rgba(10,32,51,.98),rgba(4,14,26,.99));box-shadow:0 20px 55px rgba(0,0,0,.25)}.admin-panel h1{color:#f1f8ff}.admin-panel p{color:#9fb5c9}.admin-form{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.admin-form input{flex:1;min-width:210px;padding:13px 15px;border:1px solid rgba(0,217,255,.25);border-radius:10px;background:#061a2b;color:#fff}.admin-form button,.admin-action{padding:12px 17px;border:1px solid #00d9ff;border-radius:10px;background:#00d9ff;color:#031827;font-weight:800;cursor:pointer}.admin-status{margin:12px 0;color:#8cefff;font-size:.85rem}.admin-table-wrap{overflow:auto;margin-top:22px}.admin-table{width:100%;border-collapse:collapse;min-width:760px}.admin-table th,.admin-table td{padding:12px;border-bottom:1px solid rgba(133,208,255,.13);text-align:left;color:#c6d9e8;font-size:.78rem}.admin-table th{color:#7deaff}.admin-action{padding:7px 10px;margin:2px;font-size:.7rem}.admin-action.danger{background:#522b39;border-color:#a94c6a;color:#ffe7ef}
</style></head><body><div class="page-transition"></div><header class="topbar"><div class="nav container"><a class="brand" href="index.html"><img src="assets/mm-logo.svg" alt="M~M" width="44" height="44"><strong>M~M</strong></a><nav class="nav-links"><a href="index.html">Home</a><a href="services.html">Services</a><a href="pricing.html">Pricing</a><a href="contact.html">Contact</a></nav><div class="nav-actions"><a class="btn small" href="pricing.html">View Pricing</a></div></div></header>
<main class="admin-wrap"><section class="admin-panel"><span class="eyebrow">PRIVATE AREA</span><h1>Rewards management</h1><p>Sign in with the admin account to view rewards and mark codes as redeemed or revoked.</p>
<form class="admin-form" id="loginForm"><input id="email" type="email" placeholder="Admin email" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button type="submit">Sign in</button></form>
<div class="admin-form" id="adminControls" hidden><button id="refreshBtn" type="button">Refresh rewards</button><button id="logoutBtn" type="button">Sign out</button></div><div class="admin-status" id="status" role="status">Not signed in.</div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Code</th><th>Discount</th><th>Package</th><th>Final price</th><th>Status</th><th>Expiry</th><th>Actions</th></tr></thead><tbody id="rewardRows"><tr><td colspan="7">Sign in to load rewards.</td></tr></tbody></table></div></section></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const url='https://sspzsscntnlaopfrgpvr.supabase.co',key='sb_publishable_eDoA81c2-EHz7PqGLwk1RA_PD5-RYGL';
const supabase=createClient(url,key),api=url+'/functions/v1/reward-api';
const $=id=>document.getElementById(id),status=$('status');
let session=null;
async function call(action,extra={}){const response=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...extra})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed');return data;}
async function load(){try{const data=await call('admin-list');$('rewardRows').innerHTML=data.rewards.map(r=>'<tr><td><strong>'+r.code+'</strong></td><td>'+r.discount_percent+'%</td><td>'+(r.package_key||'—')+'</td><td>'+(r.final_price_pkr?'PKR '+Number(r.final_price_pkr).toLocaleString('en-PK'):'—')+'</td><td>'+r.status+'</td><td>'+new Date(r.expires_at).toLocaleString()+'</td><td>'+(r.status==='unredeemed'?'<button class="admin-action" data-action="redeem" data-id="'+r.id+'">Redeem</button><button class="admin-action danger" data-action="revoke" data-id="'+r.id+'">Revoke</button>':'—')+'</td></tr>').join('')||'<tr><td colspan="7">No rewards found.</td></tr>';status.textContent='Loaded '+data.rewards.length+' reward records.';}catch(e){status.textContent=e.message;}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();status.textContent='Signing in…';const {data,error}=await supabase.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){status.textContent=error.message;return;}session=data.session;$('loginForm').hidden=true;$('adminControls').hidden=false;await load();});
$('refreshBtn').addEventListener('click',load);
$('logoutBtn').addEventListener('click',async()=>{await supabase.auth.signOut();session=null;$('loginForm').hidden=false;$('adminControls').hidden=true;$('rewardRows').innerHTML='<tr><td colspan="7">Sign in to load rewards.</td></tr>';status.textContent='Signed out.';});
$('rewardRows').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;b.disabled=true;try{await call(b.dataset.action,{id:b.dataset.id});await load();}catch(err){status.textContent=err.message;b.disabled=false;}});
</script></body></html>

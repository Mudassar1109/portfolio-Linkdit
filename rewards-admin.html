<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050d18">
<title>Rewards Admin | M~M Web Development</title><link rel="icon" href="assets/mm-logo.svg"><link rel="stylesheet" href="assets/css/style.css">
<style>
.admin-wrap{max-width:1100px;margin:70px auto;padding:24px}.admin-panel{padding:26px;border:1px solid rgba(0,217,255,.25);border-radius:22px;background:linear-gradient(145deg,rgba(10,32,51,.98),rgba(4,14,26,.99));box-shadow:0 20px 55px rgba(0,0,0,.25);min-width:0}.admin-panel h1{color:#f1f8ff}.admin-panel p{color:#9fb5c9}.admin-form{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.admin-form input{flex:1 1 220px;min-width:0;padding:13px 15px;border:1px solid rgba(0,217,255,.25);border-radius:10px;background:#061a2b;color:#fff}.admin-form button,.admin-action{padding:12px 17px;border:1px solid #00d9ff;border-radius:10px;background:#00d9ff;color:#031827;font-weight:800;cursor:pointer}.admin-form button:disabled,.admin-action:disabled{opacity:.55;cursor:wait}.admin-status{margin:12px 0;color:#8cefff;font-size:.9rem;min-height:1.4em}.admin-table-wrap{width:100%;margin-top:22px}.admin-table{width:100%;border-collapse:collapse;table-layout:fixed}.admin-table th,.admin-table td{padding:12px 9px;border-bottom:1px solid rgba(133,208,255,.13);text-align:left;color:#c6d9e8;font-size:.78rem;overflow-wrap:anywhere}.admin-table th{color:#7deaff}.admin-table th:nth-child(1){width:15%}.admin-table th:nth-child(2){width:9%}.admin-table th:nth-child(3){width:14%}.admin-table th:nth-child(4){width:14%}.admin-table th:nth-child(5){width:12%}.admin-table th:nth-child(6){width:17%}.admin-table th:nth-child(7){width:19%}.admin-action{padding:7px 9px;margin:2px;font-size:.7rem}.admin-action.danger{background:#522b39;border-color:#a94c6a;color:#ffe7ef}.admin-empty{text-align:center!important;padding:22px!important;color:#9fb5c9!important}
@media(max-width:760px){.admin-wrap{margin:32px auto;padding:14px}.admin-panel{padding:20px 15px}.admin-panel h1{font-size:1.8rem}.admin-form{display:grid;grid-template-columns:1fr}.admin-form input,.admin-form button{width:100%;min-height:48px}.admin-table-wrap{overflow:visible}.admin-table,.admin-table tbody{display:block;width:100%}.admin-table thead{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.admin-table tr{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin:0 0 14px;padding:10px 12px;border:1px solid rgba(0,217,255,.2);border-radius:13px;background:rgba(5,22,37,.7)}.admin-table td{display:flex;flex-direction:column;gap:5px;padding:9px 3px;border-bottom:1px solid rgba(133,208,255,.1);font-size:.82rem;min-width:0}.admin-table td:before{content:attr(data-label);color:#7deaff;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.admin-table td:last-child{grid-column:1/-1;border-bottom:0}.admin-table td.admin-empty{display:block;grid-column:1/-1}.admin-table td.admin-empty:before{content:none}.admin-action{font-size:.74rem;padding:8px 10px}}
@media(min-width:761px) and (max-width:980px){.admin-panel{padding:22px 18px}.admin-table th,.admin-table td{padding:9px 5px;font-size:.72rem}.admin-action{padding:6px 7px;font-size:.66rem}}
</style></head>
<body><div class="page-transition"></div>
<header class="topbar"><div class="nav container"><a class="brand" href="index.html"><img src="assets/mm-logo.svg" alt="M~M" width="44" height="44"><strong>M~M</strong></a><nav class="nav-links"><a href="index.html">Home</a><a href="services.html">Services</a><a href="pricing.html">Pricing</a><a href="contact.html">Contact</a></nav><div class="nav-actions"><a class="btn small" href="pricing.html">View Pricing</a></div></div></header>
<main class="admin-wrap"><section class="admin-panel"><span class="eyebrow">PRIVATE AREA</span><h1>Rewards management</h1><p>Sign in with the admin account to view rewards and mark codes as redeemed or revoked.</p>
<form class="admin-form" id="loginForm"><input id="email" type="email" placeholder="Admin email" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button id="loginBtn" type="submit">Sign in</button></form>
<div class="admin-form" id="adminControls" hidden><button id="refreshBtn" type="button">Refresh rewards</button><button id="logoutBtn" type="button">Sign out</button></div><div class="admin-status" id="status" role="status" aria-live="polite">Not signed in.</div>
<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Code</th><th>Discount</th><th>Package</th><th>Final price</th><th>Status</th><th>Expiry</th><th>Actions</th></tr></thead><tbody id="rewardRows"><tr><td class="admin-empty" colspan="7">Sign in to load rewards.</td></tr></tbody></table></div>
</section></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const url='https://sspzsscntnlaopfrgpvr.supabase.co',key='sb_publishable_eDoA81c2-EHz7PqGLwk1RA_PD5-RYGL';
const supabase=createClient(url,key),api=url+'/functions/v1/reward-api';
const $=id=>document.getElementById(id),status=$('status');
let session=null;
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
async function call(action,extra={}){if(!session?.access_token)throw new Error('Your session has expired. Please sign in again.');const response=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...extra})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Request failed ('+response.status+')');return data;}
function setSignedIn(signedIn){$('loginForm').hidden=signedIn;$('adminControls').hidden=!signedIn;}
async function load(){try{status.textContent='Loading rewards…';const data=await call('admin-list');const rewards=Array.isArray(data.rewards)?data.rewards:[];$('rewardRows').innerHTML=rewards.map(r=>'<tr><td data-label="Code"><strong>'+esc(r.code)+'</strong></td><td data-label="Discount">'+esc(r.discount_percent)+'%</td><td data-label="Package">'+esc(r.package_key||'—')+'</td><td data-label="Final price">'+(r.final_price_pkr!=null?'PKR '+Number(r.final_price_pkr).toLocaleString('en-PK'):'—')+'</td><td data-label="Status">'+esc(r.status)+'</td><td data-label="Expiry">'+(r.expires_at?esc(new Date(r.expires_at).toLocaleString()):'—')+'</td><td data-label="Actions">'+(r.status==='unredeemed'?'<button class="admin-action" data-action="redeem" data-id="'+esc(r.id)+'">Redeem</button><button class="admin-action danger" data-action="revoke" data-id="'+esc(r.id)+'">Revoke</button>':'—')+'</td></tr>').join('')||'<tr><td class="admin-empty" colspan="7">No rewards found yet.</td></tr>';status.textContent='Loaded '+rewards.length+' reward record(s).';}catch(e){status.textContent=e.message;if(/session|token|JWT/i.test(e.message)){session=null;setSignedIn(false);}}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('loginBtn');btn.disabled=true;status.textContent='Signing in…';try{const {data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;session=data.session;setSignedIn(true);$('password').value='';await load();}catch(err){status.textContent=err.message||'Sign-in failed.';}finally{btn.disabled=false;}});
$('refreshBtn').addEventListener('click',load);
$('logoutBtn').addEventListener('click',async()=>{await supabase.auth.signOut();session=null;setSignedIn(false);$('rewardRows').innerHTML='<tr><td class="admin-empty" colspan="7">Sign in to load rewards.</td></tr>';status.textContent='Signed out.';});
$('rewardRows').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;b.disabled=true;status.textContent='Updating reward…';try{await call(b.dataset.action,{id:b.dataset.id});await load();}catch(err){status.textContent=err.message;b.disabled=false;}});
supabase.auth.onAuthStateChange((_event,newSession)=>{session=newSession;if(!newSession){setSignedIn(false);}});
</script></body></html>
